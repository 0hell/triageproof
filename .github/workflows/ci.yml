name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Show Node.js version
        run: node --version
      - name: Run checks
        run: npm run check
      - name: Run local end-to-end demonstration
        run: npm run demo
      - name: Show the demonstration results
        shell: bash
        run: cat demo-output/run-*/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare a synthetic issue event
        run: node scripts/prepare-action-demo.js
      - name: Run this commit as a GitHub Action
        id: preflight
        uses: ./
        with:
          event-path: ${{ github.workspace }}/demo-output/action-event.json
          mode: advisory
      - name: Verify Action outputs
        env:
          REPORT_STATUS: ${{ steps.preflight.outputs.status }}
          REPORT_SCORE: ${{ steps.preflight.outputs.score }}
          REPORT_SECRETS: ${{ steps.preflight.outputs.potential-secrets }}
        run: >-
          node --input-type=module -e
          "import assert from 'node:assert/strict';
          assert.equal(process.env.REPORT_STATUS, 'needs-info');
          assert.equal(process.env.REPORT_SCORE, '25');
          assert.equal(process.env.REPORT_SECRETS, '0');"
