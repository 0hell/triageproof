name: Bug report
description: Report a reproducible problem in TriageProof.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please remove credentials and personal data before submitting this public report.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: Numbered steps and the smallest example that reproduces the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 环境信息
      placeholder: Operating system and Node.js version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
